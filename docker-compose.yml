services:

  mysql-db:
    image: mysql:8.0
    container_name: mysql-db

    environment:
      MYSQL_DATABASE: kottabi53
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"

    ports:
      - "3308:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s


  redis:
    image: redis:alpine
    container_name: redis

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data


  kottabi:
    build: .
    container_name: kottabi

    ports:
      - "8081:8080"

    env_file:
      - .env

    environment:
      SPRING_DATABASE_URL: jdbc:mysql://mysql-db:3306/kottabi53?createDatabaseIfNotExist=true
      REDIS_HOST: redis

    depends_on:
      mysql-db:
        condition: service_healthy
      redis:
        condition: service_started

    restart: unless-stopped


volumes:
  mysql_data:
  redis_data: